<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <!-- TODO: make the logo a link to the home page -->

  </header>

  <!-- Navigation -->
  <nav>
    <ul>

  <!-- Main content -->
  <main>
    <h1>Contact Us</h1>
    <p>Want to book a beginner class, a group session or a kids' party? Send us a message and we will get back to you within one business day.</p>

    <address>
      45 Maroondah Highway<br>
      Ringwood VIC 3134
    </address>

    <form class="contact-form" action="#">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="text" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Summit Climbing Gym | Phone 03 9000 7788</p>
  </footer>

</body>
</html>
